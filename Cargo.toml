[package]
name = "rustydav"
version = "0.2.0"
authors = ["Andrei Nagacevschi <andrein_bio@yahoo.com>"]
edition = "2024"
description = "Small library that can be used to make calls to webdav server"
homepage = "https://github.com/andreinbio/rustydav"
documentation = "https://docs.rs/rustydav"
repository = "https://github.com/andreinbio/rustydav"
keywords = ["webdav", "rustydav"]
license = "GPL-3.0"
readme = "README.md"
include = [
	"**/*.rs",
	"Cargo.toml",
]

[dependencies]
# We enable default-features so async functionality (tokio runtime bindings inside reqwest) is active by default.
reqwest = { version = "0.13.4", default-features = true, features = ["form", "native-tls"] }
base64 = "0.23.1"
http = "1.5.0"
url = "2.5.8"

[features]
default = []
# This forwards your local feature flag straight to reqwest's internal blocking module
blocking = ["reqwest/blocking"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
rustydav = { path = ".", features = ["blocking"] }
wiremock = "0.6.5"

[package.metadata.docs.rs]
# Document all features, including the blocking module
all-features = true
# Enable unstable rustdoc features on docs.rs to get beautiful "This is supported on feature 'blocking' only" banners
rustdoc-args = ["--cfg", "docsrs"]